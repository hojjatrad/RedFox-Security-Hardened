server {
    listen 80;
    server_name example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name example.com;
    root /var/www/redfox/current;
    index index.php;
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location ~ ^/(?:bin|lib|vendor|migrations|re/rx)(?:/|$) { deny all; }
    location = /config.php { deny all; }
    location = /table.php { deny all; }
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(?:log|sql|bak|old|orig|swp|dist|md)$ { deny all; }
    location ^~ /logs/ { deny all; }
    location ^~ /storage/ { deny all; }
    location ^~ /updates/ { deny all; }
    location ^~ /Upload/ { deny all; }

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 120s;
        fastcgi_hide_header X-Powered-By;
    }

    location = /health.php { access_log off; include fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root/health.php; fastcgi_pass unix:/run/php/php8.4-fpm.sock; }
    location = /ready.php  { access_log off; include fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root/ready.php;  fastcgi_pass unix:/run/php/php8.4-fpm.sock; }
}
